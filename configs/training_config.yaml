# Experiment Configuration
experiment:
  name: "warehouse_ppo_15tasks"
  seed: 42
  device: "cpu"  # or "cuda"
  seeds: [42] #, 123, 456, 789, 1011]  # List of seeds for multiple runs

# Environment
environment:
  n_batches: 10
  n_robots: 6
  robot_capacity: 3
  radius: 20
  feature_size: 9
  assignment_interval: 25
  max_steps: 1500
  agents_file: "data/agents.npy"
  data_dir: "data"
  use_true_id: false

# GNN Architecture
model:
  gnn_type: "graphsage"  # or "gcn"
  hidden_dim: 128
  num_gnn_layers: 2
  activation: "relu"
  dropout: 0.0

# PPO Hyperparameters
ppo:
  n_steps: 1024  # Number of steps per update
  batch_size: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null  # None means no clipping
  ent_coef: 0.0  # Entropy coefficient for exploration
  vf_coef: 0.35   # Value function coefficient
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  use_sde: false
  sde_sample_freq: -1

# Training
training:
  total_timesteps: 1000  # Total environment steps
  save_freq: 250  # Save model every N steps
  eval_freq: 250  # Evaluate every N steps
  eval_episodes: 10
  log_interval: 1
  checkpoint_dir: "checkpoints_ppo"
  tensorboard_log: "tensorboard_logs"